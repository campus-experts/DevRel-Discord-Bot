# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
#
# Local development / self-hosted deployment helper.
#
# Usage:
#   1. Copy .env.example to .env and fill in DISCORD_TOKEN & YOUTUBE_API_KEY.
#   2. docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  bot:
    build: .
    restart: unless-stopped

    # Mount config so you can edit config.yaml without rebuilding the image.
    volumes:
      - ./config:/app/config:ro
      # Persist state.json between container restarts.
      - bot_data:/app/data

    # Load secrets from the .env file (never committed to source control).
    env_file:
      - .env

    # Alternatively, inject secrets directly:
    # environment:
    #   - DISCORD_TOKEN=${DISCORD_TOKEN}
    #   - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}

volumes:
  bot_data:
