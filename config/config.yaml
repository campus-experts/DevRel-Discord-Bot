# ─────────────────────────────────────────────────────────────────────────────
# config/config.yaml
#
# Non-secret configuration for the DevRel Discord Bot.
# Secrets (DISCORD_TOKEN, YOUTUBE_API_KEY) live in .env (or host env vars).
#
# How to fill this in
# ───────────────────
# 1. discord_channel_id  – Right-click a channel in Discord (Developer Mode
#    must be on: Settings > Advanced > Developer Mode) and choose
#    "Copy Channel ID".
# 2. youtube.channel_id  – The ID of the YouTube channel to watch.
#    GitHub's channel ID is: UC7c3Kb6jYCRj4JOHHZTxKsA
# ─────────────────────────────────────────────────────────────────────────────

youtube:
  # YouTube channel to watch for new uploads
  channel_id: "UC7c3Kb6jYCRj4JOHHZTxKsA"          # GitHub's YouTube channel

  # Discord channel where the weekly digest is posted
  # Replace with your actual channel ID (integer)
  discord_channel_id: 123456789012345678

  # Weekly digest schedule
  # digest_day  – day of week to post the digest (case-insensitive)
  # digest_hour – hour in UTC to post (24-hour clock; 20 = 8 PM UTC, "Thursday night")
  digest_day: "thursday"
  digest_hour: 20

  # Keyword used to filter videos (case-insensitive search of title + description)
  keyword: "Copilot"

  # Number of top videos to include in the digest
  digest_count: 3

  # Candidate pool size: how many recent keyword-matching videos to fetch before
  # ranking by view count and picking the top digest_count
  search_pool: 20

blog:
  # RSS feed URL for the GitHub Blog
  feed_url: "https://github.blog/feed/"

  # Discord channel where the weekly digest is posted
  # Replace with your actual channel ID (integer)
  discord_channel_id: 123456789012345679

  # Weekly digest schedule (same settings as youtube above)
  digest_day: "thursday"
  digest_hour: 20

  # Keyword used to filter blog posts (case-insensitive search of title + summary)
  keyword: "Copilot"

  # Number of posts to include in the digest
  digest_count: 3

  # Candidate pool size: how many feed entries to inspect before stopping
  search_pool: 20
