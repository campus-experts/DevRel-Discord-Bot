name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "copilot/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q main.py bot utils tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
